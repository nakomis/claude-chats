name: python

# Every Python package's tests, on pull requests and main/develop pushes (CHATS-36):
#   hook/   the capture package (record, drain-outbox, replay-fallback, …)
#   mcp/    the MCP server, which depends on hook/ for embedding
#   tests/  facts, facts_eval, the schema checksum, the localhost/ layout guard
#           and install.sh run against a throwaway HOME
# plus a smoke test of the single-machine edition through its real commands.
#
# Postgres is a pgvector service container, so the database tests run here
# instead of being skipped. Nothing needs a real embedder or model: embeddings
# come from a fake Ollama, and the facts extractor's model is always a fake.
# Anything that does need one skips itself when its credentials are absent.
on:
  pull_request:
  # Pull requests cover feature branches. Pushes run on main and on the
  # long-lived develop branches that feature PRs target.
  push:
    branches: [main, '*develop*']

permissions:
  contents: read

# Explicitly bash, which GitHub then runs with -o pipefail: the test steps
# pipe pytest through tee, and a failure must not be swallowed by it.
defaults:
  run:
    shell: bash

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # The service container below; tests create and drop their own databases.
  CLAUDE_CHATS_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
  FACTS_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  test:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [hook, mcp, root]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_localhost_upgrade.py installs the single-machine edition
          # from an old commit, then upgrades it.
          fetch-depth: ${{ matrix.suite == 'root' && '0' || '1' }}  # '0', not 0, which is falsy here
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - name: Install the Postgres client
        if: matrix.suite == 'root'
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      # One suite per job, and pytest without xdist: no parallel workers.
      # -rs lists every skip with its reason; a database test skipping here,
      # where the DSNs are set, means the gate is broken, so it fails the job.
      - name: hook
        if: matrix.suite == 'hook'
        working-directory: hook
        run: uv run --locked pytest tests -v -rs | tee "$RUNNER_TEMP/pytest.log"
      - name: mcp
        if: matrix.suite == 'mcp'
        working-directory: mcp
        run: uv run --locked pytest tests -v -rs | tee "$RUNNER_TEMP/pytest.log"
      - name: root tests/
        if: matrix.suite == 'root'
        env:
          # tests/test_convmem_backup.py: the backup scripts `docker exec` into
          # the service container, as they do into claude-chats-db (CHATS-41).
          CONVMEM_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --no-project --with pytest --with 'psycopg[binary]' pytest tests -v -rs | tee "$RUNNER_TEMP/pytest.log"
      - name: No database test was skipped
        run: |
          if grep -E '^SKIPPED .*(_DSN|CONVMEM_TEST_)' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::database tests skipped although the test DSNs are set"
            exit 1
          fi

  smoke:
    name: Single-machine smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - name: Install the Postgres client
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Shell scripts parse
        run: |
          bash -n localhost/install.sh scripts/backup.sh scripts/restore.sh scripts/convmem-archive.sh \
              scripts/smoke-localhost.sh scripts/upgrade-check-localhost.sh tests/fixtures/docker-pg-stub
          shellcheck -S error localhost/install.sh scripts/backup.sh scripts/restore.sh \
              scripts/convmem-archive.sh scripts/smoke-localhost.sh scripts/upgrade-check-localhost.sh \
              tests/fixtures/docker-pg-stub
      - name: The systemd units are valid
        run: |
          mkdir -p /tmp/units
          for unit in claude-chats-drain claude-chats-facts claude-chats-nightly-backup; do
            sed -e "s|UV_PATH|$(command -v true)|" -e "s|REPO_PATH|${GITHUB_WORKSPACE}|" \
                -e "s|CONFIG_PATH|/tmp/config.env|" "localhost/systemd/${unit}.service" \
                > "/tmp/units/${unit}.service"
            cp "localhost/systemd/${unit}.timer" /tmp/units/
            systemd-analyze verify "/tmp/units/${unit}.timer" "/tmp/units/${unit}.service"
          done
      - name: The launchd agents are valid plists
        run: |
          for plist in localhost/launchd/*.plist; do
            python3 -c 'import plistlib, sys; plistlib.load(open(sys.argv[1], "rb"))' "$plist"
          done
      - name: docker-compose.yml resolves the shared init.sql
        run: |
          docker compose -f localhost/docker-compose.yml config > /tmp/compose.yml
          grep -q "source: ${GITHUB_WORKSPACE}/init.sql" /tmp/compose.yml
      - name: Sync the hook, the MCP server and the facts environment
        run: |
          uv sync --locked --project hook
          uv sync --locked --project mcp
          uv sync --locked --project localhost/facts
      - name: Hook → outbox → drain → Postgres → MCP search → facts → recall_facts
        run: scripts/smoke-localhost.sh

  upgrade-docker:
    name: Single-machine upgrade (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The root suite runs tests/test_localhost_upgrade.py against the service
    # container; this runs it again with both installers' real `docker compose`
    # and container, unmodified (CHATS-37).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - name: Old install, used, then upgraded in place
        run: scripts/upgrade-check-localhost.sh
