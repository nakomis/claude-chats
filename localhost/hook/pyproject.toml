[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-chats-hook-localhost"
version = "0.1.0"
description = "Claude Code hook — records conversation messages to a local PostgreSQL (single-machine edition)"
requires-python = ">=3.11"
# No stomp.py: nothing here talks to a queue.
dependencies = [
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "boto3>=1.35.0",
    "openai>=1.0.0",
]

[project.scripts]
record-conversation = "hook.record:main"
drain-outbox = "hook.drain:main"
backfill-embeddings = "hook.backfill:main"
replay-fallback = "hook.replay_fallback:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["hook"]
